  /students/{id}/courses:
    get:
      operationId: getStudentCourses
      tags: [students]
      summary: Get student enrolled courses
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"

  # FACULTY
  /faculty:
    get:
      operationId: listFaculty
      tags: [faculty]
      summary: List faculty
      parameters:
