  # LIBRARY
  /library/books:
    get:
      operationId: listBooks
      tags: [library]
      summary: List books
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: available
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
