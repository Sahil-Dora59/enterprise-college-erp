  # MARKS
  /marks:
    get:
      operationId: listMarks
      tags: [marks]
      summary: List marks
      parameters:
        - name: examinationId
          in: query
          schema:
            type: integer
        - name: studentId
          in: query
          schema:
            type: integer
        - name: courseId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Marks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mark"
